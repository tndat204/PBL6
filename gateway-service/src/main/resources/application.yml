server:
  port: 8080
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0  # Don't strip prefix for auth service

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**, /api/permissions/**, /api/roles/**, /api/internal/users/**
          filters:
            - StripPrefix=0  # Don't strip prefix

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0  # Don't strip prefix

        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/files/**
          filters:
            - StripPrefix=0  # Don't strip prefix

        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/jobs/**, /api/applications/**, /api/companies/**, /api/reviews/**
          filters:
            - StripPrefix=0  # Don't strip prefix

        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/api/profiles/**, /api/categories/**, /api/skills/**
          filters:
            - StripPrefix=0  # Don't strip prefix

        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/messages/**, /api/conversations/**, /ws/**
          filters:
            - StripPrefix=0

        - id: statistic-service
          uri: lb://statistic-service
          predicates:
            - Path=/api/statistics/**
          filters:
            - StripPrefix=0
# Eureka Server Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    hostname: localhost



# Logging configuration
logging:
  level:
    com.pbl6.gatewayservice: DEBUG
    org.springframework.cloud.gateway: DEBUG
    com.netflix.eureka: OFF
    com.netflix.discovery: OFF

