spring:
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
    import: file:.env[.properties]
  application:
    name: notification-service

  data:
    mongodb:
      uri: mongodb://admin:123456@localhost:27017/notification_service?authSource=admin
      database: notification_service

  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

logging:
  level:
    org.springframework.data.mongodb.core: info
    org.springframework: info

springdoc:
  api-docs:
    enabled: true  # Bật endpoint /v3/api-docs
  swagger-ui:
    enabled: true # Tắt UI nếu muốn

brevo:
  api-key: ${BREVO_API_KEY}
server:
  port: 8083

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    hostname: localhost

---
spring:
  config:
    activate:
      on-profile: prod

  application:
    name: notification-service

  data:
    mongodb:
      uri: mongodb://your_prod_username:your_prod_password@your_prod_host:27017/notification_service
      database: notification_service


logging:
  level:
    root: warn
